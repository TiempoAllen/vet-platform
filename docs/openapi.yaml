      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. The veterinarian cannot change; a closure cannot become a personal exception or the reverse.'
