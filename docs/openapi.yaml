  /api/consultations/{consultationId}/attachments:
    parameters:
      - { name: consultationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Attachments]
      operationId: uploadConsultationAttachment
      summary: Upload a file for a consultation
      description: >
        Requires `clinical.write`. In-progress or completed consultations; a discarded one is 409. multipart/form-data with exactly one `file` part (JPEG, PNG, WebP or PDF,
        recognised by its content; at most 20 MB) and an optional `description` (max 500). Order of checks: owner
        (404/409, before the body is read); request (415 not multipart, 413 body over the limit, 400 malformed);
        form fields (422); type (415); size (413). The stored fileName gets the detected type's extension.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AttachmentUpload' }
      responses:
        '201':
          description: Stored.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/attachments/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Attachments]
      operationId: listConsultationAttachments
      summary: Files of a consultation
      description: Requires `clinical.read`. Newest first; Active files unless `status=Withdrawn`. Unknown owner 404. Audited (attachment.listed).
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AttachmentStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of attachments.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

