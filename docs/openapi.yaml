        frequency: { type: string, minLength: 1, maxLength: 100 }
        duration: { type: [string, 'null'], maxLength: 100 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 100000, description: At most 3 decimals. }
        quantityUnit: { type: string, minLength: 1, maxLength: 50 }
        refills: { type: [integer, 'null'], minimum: 0, maximum: 12 }
        instructions: { type: [string, 'null'], maxLength: 2000 }
        diagnosisId: { type: [string, 'null'], format: uuid }

    UpdatePrescriptionRequest:
      type: object
      description: Omitted or null fields are unchanged; an empty string clears optional text (required text cannot be blank); an explicit null diagnosisId unlinks.
      properties:
        medicationName: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        dose: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        route: { type: [string, 'null'], maxLength: 100 }
        frequency: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        duration: { type: [string, 'null'], maxLength: 100 }
        quantity: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 100000 }
        quantityUnit: { type: [string, 'null'], minLength: 1, maxLength: 50 }
        refills: { type: [integer, 'null'], minimum: 0, maximum: 12 }
        instructions: { type: [string, 'null'], maxLength: 2000 }
        diagnosisId: { type: [string, 'null'], format: uuid }

    CancelPrescriptionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    PatientPrescriptionPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [prescription, consultationId, consultationCompletedAt, veterinarian]
            properties:
              prescription: { $ref: '#/components/schemas/Prescription' }
              consultationId: { type: string, format: uuid }
              consultationCompletedAt: { type: string, format: date-time, description: With the clinic's local offset. }
              veterinarian: { $ref: '#/components/schemas/PersonSummary' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    VaccinationStatus:
      type: string
      description: Voided means entered in error; the record is kept and left out of due dates.
      enum: [Active, Voided]

    Vaccination:
      type: object
      additionalProperties: false
      required: [id, patientId, consultationId, vaccineName, manufacturer, lotNumber, lotExpiresOn, administeredOn, nextDueOn, administeredElsewhere, veterinarian, notes, status, voidedAt, voidedBy, voidReason, recordedBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        consultationId: { type: [string, 'null'], format: uuid }
        vaccineName: { type: string, maxLength: 200, description: Free text until the product catalogue exists (B-19). }
        manufacturer: { type: [string, 'null'], maxLength: 100 }
        lotNumber: { type: [string, 'null'], maxLength: 50 }
        lotExpiresOn: { type: [string, 'null'], format: date }
        administeredOn: { type: string, format: date, description: The clinic-local day the dose was given. }
        nextDueOn: { type: [string, 'null'], format: date }
        administeredElsewhere: { type: [string, 'null'], maxLength: 200, description: Where the dose was given when not here. }
        veterinarian:
          description: The veterinarian who gave it here; null for doses given elsewhere.
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/VaccinationStatus' }
        voidedAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        voidedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        voidReason: { type: [string, 'null'], maxLength: 500 }
        recordedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VaccinationPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Vaccination' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    RecordVaccinationRequest:
      type: object
      required: [vaccineName, administeredOn]
      description: veterinarianId is required for doses given here and must be left out when administeredElsewhere is set. Optional text may be omitted, null or blank.
      properties:
        vaccineName: { type: string, minLength: 1, maxLength: 200 }
        manufacturer: { type: [string, 'null'], maxLength: 100 }
        lotNumber: { type: [string, 'null'], maxLength: 50 }
        lotExpiresOn: { type: [string, 'null'], format: date, description: 2000-01-01 to 2100-12-31. }
        administeredOn: { type: string, format: date, description: 'From 2000-01-01 up to today in the clinic''s time zone.' }
        nextDueOn: { type: [string, 'null'], format: date, description: After administeredOn and no later than 2100-12-31. }
        administeredElsewhere: { type: [string, 'null'], maxLength: 200 }
        veterinarianId: { type: [string, 'null'], format: uuid }
        consultationId: { type: [string, 'null'], format: uuid, description: An in-progress or completed consultation of the same patient. }
        notes: { type: [string, 'null'], maxLength: 2000 }

    VoidVaccinationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    DueVaccinationPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [vaccinationId, vaccineName, lastAdministeredOn, nextDueOn, patient, client]
            properties:
              vaccinationId: { type: string, format: uuid, description: The latest active dose. }
              vaccineName: { type: string }
              lastAdministeredOn: { type: string, format: date }
              nextDueOn: { type: string, format: date }
              patient:
                type: object
                additionalProperties: false
                required: [id, name, species]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  species: { $ref: '#/components/schemas/Species' }
              client:
                description: The patient's current owner, for the reminder call; null if it can no longer be shown.
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [id, firstName, lastName, phone, email, preferredContactMethod]
                    properties:
                      id: { type: string, format: uuid }
                      firstName: { type: string }
                      lastName: { type: string }
                      phone: { type: [string, 'null'] }
                      email: { type: [string, 'null'] }
                      preferredContactMethod:
                        oneOf:
                          - $ref: '#/components/schemas/ContactMethod'
                          - type: 'null'
                  - type: 'null'
        pagination: { $ref: '#/components/schemas/Pagination' }

    AttachmentStatus:
      type: string
      description: Withdrawn means uploaded by mistake; hidden from lists and not downloadable, but kept.
      enum: [Active, Withdrawn]

    Attachment:
      type: object
      additionalProperties: false
      required: [id, ownerType, patientId, consultationId, clientId, fileName, contentType, sizeBytes, sha256, description, status, withdrawnAt, withdrawnBy, withdrawReason, uploadedBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerType: { type: string, enum: [Patient, Consultation, Client] }
        patientId: { type: [string, 'null'], format: uuid, description: Set for patient and consultation files. }
        consultationId: { type: [string, 'null'], format: uuid }
        clientId: { type: [string, 'null'], format: uuid }
        fileName: { type: string, maxLength: 255, description: 'The uploader''s base name without path, control or invisible formatting characters or quotes, with the detected type''s extension; only the download name.' }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf], description: Recognised from the content. }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        description: { type: [string, 'null'], maxLength: 500 }
        status: { $ref: '#/components/schemas/AttachmentStatus' }
        withdrawnAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        withdrawnBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        withdrawReason: { type: [string, 'null'], maxLength: 500 }
        uploadedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttachmentPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    AttachmentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: Exactly one file part; at most 20 MB. }
        description: { type: string, maxLength: 500 }

    WithdrawAttachmentRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    ClinicalNote:
      type: object
      additionalProperties: false
      required: [id, patientId, consultationId, text, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        consultationId: { type: [string, 'null'], format: uuid }
        text: { type: string, maxLength: 4000 }
        author:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time, description: With the clinic's local offset. }

    ClinicalNotePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClinicalNote' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    AddClinicalNoteRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        consultationId: { type: [string, 'null'], format: uuid }

    TaxRateStatus:
      type: string
      enum: [Active, Archived]

    TaxRate:
      type: object
      additionalProperties: false
      required: [id, name, ratePercent, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        ratePercent: { type: number, minimum: 0, maximum: 100, description: At most 4 decimals; never changes. }
        status: { $ref: '#/components/schemas/TaxRateStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaxRatePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaxRate' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    CreateTaxRateRequest:
      type: object
      required: [name, ratePercent]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        ratePercent: { type: number, minimum: 0, maximum: 100, description: At most 4 decimals. }

    UpdateTaxRateRequest:
      type: object
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        status:
          oneOf:
            - $ref: '#/components/schemas/TaxRateStatus'
            - type: 'null'

    InvoiceStatus:
      type: string
      enum: [Draft, Issued, Void]

    DiscountType:
      type: string
      enum: [None, Percent, Amount]

    InvoiceItem:
      type: object
      additionalProperties: false
      required: [id, position, description, quantity, unitPrice, discountType, discountValue, taxRate, consultationId, net, discount, tax, total]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 1000000, description: At most 3 decimals. }
        unitPrice: { type: number, minimum: 0, maximum: 1000000000, description: Before tax and discount; at most 4 decimals. }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        discountValue: { type: number, description: 'A percentage (Percent) or an amount in the invoice currency (Amount); 0 for None.' }
        taxRate:
          type: object
          additionalProperties: false
          required: [id, name, percent]
          description: A copy of the rate when the line was written.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            percent: { type: number }
        consultationId: { type: [string, 'null'], format: uuid }
        net: { type: number, description: 'quantity × unitPrice, rounded to the currency.' }
        discount: { type: number }
        tax: { type: number, description: '(net − discount) × percent / 100, rounded.' }
        total: { type: number, description: net − discount + tax. }

    Invoice:
      type: object
      additionalProperties: false
      required: [id, number, status, client, patient, currency, notes, items, subtotal, discountTotal, taxTotal, total, issuedAt, dueOn, issuedBy, voidedAt, voidedBy, voidReason, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: [integer, 'null'], description: Gapless per clinic; null for drafts. }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        client:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, firstName, lastName]
              properties:
                id: { type: string, format: uuid }
                firstName: { type: string }
                lastName: { type: string }
            - type: 'null'
        patient:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, name, species]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                species: { $ref: '#/components/schemas/Species' }
            - type: 'null'
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        notes: { type: [string, 'null'], maxLength: 2000 }
        items:
          type: array
          description: By position.
          items: { $ref: '#/components/schemas/InvoiceItem' }
        subtotal: { type: number, description: Sum of the lines' net. }
        discountTotal: { type: number }
        taxTotal: { type: number }
        total: { type: number, description: subtotal − discountTotal + taxTotal. }
        issuedAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        dueOn: { type: [string, 'null'], format: date }
        issuedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        voidedAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        voidedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        voidReason: { type: [string, 'null'], maxLength: 500 }
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InvoicePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    CreateInvoiceRequest:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string, format: uuid }
        patientId: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'], maxLength: 2000 }

    UpdateInvoiceRequest:
      type: object
      description: Omitted fields are unchanged; patientId null removes the patient; an empty string clears notes.
      properties:
        clientId: { type: [string, 'null'], format: uuid }
        patientId: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CreateInvoiceItemRequest:
      type: object
      required: [description, quantity, unitPrice, taxRateId]
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        unitPrice: { type: number, minimum: 0, maximum: 1000000000 }
        discountType:
          oneOf:
            - $ref: '#/components/schemas/DiscountType'
            - type: 'null'
        discountValue: { type: [number, 'null'], description: 'Percent: above 0 and at most 100, at most 4 decimals. Amount: above 0, at most the net, in currency minor units. None: omit or 0.' }
        taxRateId: { type: string, format: uuid, description: An active rate of the clinic. }
        consultationId: { type: [string, 'null'], format: uuid, description: A non-discarded consultation of the invoice's patient. }

    UpdateInvoiceItemRequest:
      type: object
      description: Omitted or null fields are unchanged; an explicit null consultationId unlinks.
      properties:
        description: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        quantity: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 1000000 }
        unitPrice: { type: [number, 'null'], minimum: 0, maximum: 1000000000 }
        discountType:
          oneOf:
            - $ref: '#/components/schemas/DiscountType'
            - type: 'null'
        discountValue: { type: [number, 'null'] }
        taxRateId: { type: [string, 'null'], format: uuid }
        consultationId: { type: [string, 'null'], format: uuid }

    IssueInvoiceRequest:
      type: object
      properties:
        dueOn: { type: [string, 'null'], format: date, description: 'On or after the clinic-local issue day and no later than 2100-12-31.' }

    VoidInvoiceRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [Healthy, Degraded, Unhealthy] }

    ErrorCode:
      type: string
      enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, CSRF_TOKEN_INVALID, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
             PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, VALIDATION_ERROR, RATE_LIMITED, INTERNAL_ERROR]

    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field: { type: string, description: camelCase field or query parameter name }
                  message: { type: string }
        requestId: { type: string }

  responses:
    BadRequest:
      description: Body missing or not valid JSON, or an unknown enum name in the body (BAD_REQUEST).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Not signed in or session ended (UNAUTHENTICATED). Refresh the CSRF token, then show the login screen.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Signed in but missing the required permission (FORBIDDEN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CsrfInvalid:
      description: Missing or invalid X-XSRF-TOKEN (CSRF_TOKEN_INVALID). Refresh with GET /api/auth/csrf and retry once.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ForbiddenOrCsrf:
      description: FORBIDDEN (missing permission) or CSRF_TOKEN_INVALID; check error.code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Unknown id, or a record of another clinic (NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Business rule conflict (CONFLICT); show error.message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: The file is over 20 MB (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedFile:
      description: Not multipart/form-data, or the file is not a JPEG, PNG, WebP image or PDF by its content (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Field or query values invalid (VALIDATION_ERROR); details name each field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many attempts (RATE_LIMITED).
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
