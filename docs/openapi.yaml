openapi: 3.1.0
info:
  title: Veterinary Management Platform API
  version: 0.16.0
  summary: Implemented endpoints as of milestone B-16.
  description: |
    Machine-readable specification of the endpoints that exist today. `docs/API.md` is the narrative contract and
    wins if the two disagree; update both in the same change. Planned endpoints (clinical,
    billing, inventory, reports) are listed in `API.md` sections 7-12 and are added here when implemented.

    Conventions (API.md sections 2, 3 and 13):
    - Same-site only, HTTPS, no CORS. Authentication is the HttpOnly `__Host-vet_session` cookie.
    - Every unsafe request (POST, PUT, PATCH, DELETE), including login and logout, needs the `X-XSRF-TOKEN` header
      equal to the `XSRF-TOKEN` cookie, obtained from `GET /api/auth/csrf`.
    - Every endpoint requires a signed-in user unless it declares `security: []`.
    - Error precedence: 429, 401, 403 FORBIDDEN, 403 CSRF_TOKEN_INVALID, 400/422, then the endpoint's own result
      (scheduling: a schedules.manage_own caller acting on another veterinarian's schedule gets its 403 after 400/422).
    - A concurrent change or delete of the same record, a deadlock or a serialization failure is 409 CONFLICT
      (retry).
    - Every response carries `X-Request-Id`.
    - Enum values are accepted only as exact names (`Admin`, `Active`).
    - Instants must carry an explicit offset (`Z` or `+01:00`); dates are `YYYY-MM-DD`.
servers:
  - url: https://localhost:7096
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Clients
  - name: Patients
  - name: Clinic
  - name: Scheduling
  - name: Appointments
  - name: Consultations
  - name: Vaccinations
  - name: Attachments
  - name: ClinicalNotes
  - name: Billing
  - name: Operations
security:
  - sessionCookie: []

paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Issue the CSRF cookie
      description: Sets the readable `XSRF-TOKEN` cookie bound to the current session (or to "signed out"). Call before the first unsafe request, after any 401, and when a request fails with CSRF_TOKEN_INVALID.
      security: []
      responses:
        '204':
          description: Cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`XSRF-TOKEN=...; Secure; SameSite=Strict; Path=/`'
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Rate limited to 10 attempts per minute per client address (IPv6 grouped by /64). Every credential failure
        (unknown email, wrong password, locked account, disabled user, suspended clinic) returns the same 401 with the
        message `Email or password is incorrect.` Five consecutive wrong passwords lock the account for 15 minutes.
        Signing in again from the same browser replaces the previous session.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Sets the session cookie and a new `XSRF-TOKEN` cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Revokes the session server-side and clears the cookie. Succeeds even when not signed in; a valid CSRF token is still required.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Signed out. Sets a new signed-out `XSRF-TOKEN` cookie.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user, clinic, roles and permissions
      description: Roles and permissions reflect the current state on every call. Use `permissions` to decide what to show; the API enforces them regardless.
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password
      description: |
        Rate limited like login. On success every other session of the user is signed out; this one stays.
        Wrong current passwords count towards the account lockout; the attempt that locks the account returns 401
        and signs out every session, this one included.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '422':
          description: '`currentPassword` is incorrect, or `newPassword` fails the policy (12-1024 characters, not the email).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List the clinic's users
      description: 'Requires `users.read`. Users who never signed in sort last ascending and first descending; ties are broken by id.'
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of name or email. `%` and `_` match literally.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, email, -email, createdAt, -createdAt, lastLoginAt, -lastLoginAt]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user in the caller's clinic
      description: Requires `users.manage`. Emails are unique across the whole platform.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/users/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one user
      description: Requires `users.read`. Users of other clinics are 404.
      responses:
        '200':
          description: The user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Partially update a user
      description: |
        Requires `users.manage`. Omitted or null fields are unchanged; `"phone": ""` clears the phone.
        Disabling a user ends all their sessions immediately; re-enabling does not restore them.
        409 when the email is taken (detail field `email`), when disabling yourself, or when disabling the clinic's
        last active administrator.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace a user's roles
      description: Requires `users.manage`. Duplicates are ignored. 409 when it would remove Admin from the clinic's last active administrator. Takes effect on the user's next request.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolesRequest' }
      responses:
        '200':
          description: Updated user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List the clinic's clients
      description: Requires `clients.read`. Lists active and inactive clients unless `status` is given; ties are broken by id.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of first name, last name, "first last", email or phone. `%` and `_` match literally.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClientStatus' }
        - name: sort
          in: query
          description: '`name` sorts by last name, then first name. Ties are broken by id in the same direction.'
          schema:
            type: string
            enum: [name, -name, createdAt, -createdAt, updatedAt, -updatedAt]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of clients.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Clients]
      operationId: createClient
      summary: Create a client in the caller's clinic
      description: Requires `clients.manage`. New clients are `Active`. Emails need not be unique.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClientRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/clients/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      operationId: getClient
      summary: Get one client
      description: Requires `clients.read`. Clients of other clinics are 404.
      responses:
        '200':
          description: The client.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clients]
      operationId: updateClient
      summary: Partially update a client
      description: |
        Requires `clients.manage`. Omitted or null text fields are unchanged; `""` clears an optional text field.
        `preferredContactMethod` is unchanged when omitted and cleared by an explicit `null`. Deactivate with
        `"status": "Inactive"`; clients are never deleted (DELETE is 405 METHOD_NOT_ALLOWED).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClientRequest' }
      responses:
        '200':
          description: Updated client.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List the clinic's patients
      description: Requires `patients.read`. Lists all statuses unless `status` is given; ties are broken by id in the sort direction.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the patient's name or the owner's first, last or full name, or a substring of the microchip number ignoring spaces, dashes and dots. `%` and `_` match literally.
          schema: { type: string, maxLength: 100 }
        - name: clientId
          in: query
          description: Only this owner's patients. An unknown id returns an empty page.
          schema: { type: string, format: uuid }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PatientStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, createdAt, -createdAt, updatedAt, -updatedAt]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of patients.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Create a patient in the caller's clinic
      description: |
        Requires `patients.manage`. New patients are `Active`. `clientId` must be an active client of the clinic
        (otherwise 422 on `clientId`, same message for unknown, inactive and other clinics' clients). Microchip numbers
        are normalised and unique within the clinic (409). Server-side problems are reported together in one 422.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePatientRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/patients/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/patients/{id}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Get one patient
      description: Requires `patients.read`. Patients of other clinics are 404.
      responses:
        '200':
          description: The patient.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Partially update or transfer a patient
      description: |
        Requires `patients.manage`. Omitted or null fields are unchanged, except `dateOfBirth`, `weightKg` and
        `dateOfDeath`, which an explicit null clears; `""` clears optional text. `clientId` transfers to another
        active client of the clinic. `dateOfDeath` needs status `Deceased`; leaving `Deceased` clears it. Patients
        are never deleted (DELETE is 405 METHOD_NOT_ALLOWED).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePatientRequest' }
      responses:
        '200':
          description: Updated patient.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/patients/{id}/history:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      operationId: getPatientHistory
      summary: The patient's timeline, newest first
      description: |
        Requires `patients.read`. Unknown or other clinics' patients are 404. Entries have a fixed `details` shape per
        `type`; clients must ignore types they do not know, because later milestones add types without a version
        change. Ties on `occurredAt` are broken by `id`, then `type`, descending (uuids compare as lowercase hex
        strings).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of history entries.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/clinic:
    get:
      tags: [Clinic]
      operationId: getClinic
      summary: The caller's clinic
      description: Any signed-in user.
      responses:
        '200':
          description: The clinic.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Clinic]
      operationId: updateClinic
      summary: Change the clinic's time zone or currency
      description: >
        Requires `settings.manage`. `timeZone` must be an IANA id (Windows ids are 422). `currency` must be an
        upper-case ISO 4217 code (422 otherwise) and can change only while the clinic has no invoice (409). Audited.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClinicRequest' }
      responses:
        '200':
          description: Updated clinic.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/veterinarians:
    get:
      tags: [Scheduling]
      operationId: listVeterinarians
      summary: Active veterinarians, by name
      description: Requires `schedules.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of veterinarians.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VeterinarianPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/veterinarians/{veterinarianId}/weekly-hours:
    parameters:
      - $ref: '#/components/parameters/VeterinarianId'
    get:
      tags: [Scheduling]
      operationId: listWeeklyHours
      summary: All weekly-hours blocks of a veterinarian
      description: Requires `schedules.read`. Not paginated; Monday first, then by start time.
      responses:
        '200':
          description: The blocks.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingHoursBlockList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Scheduling]
      operationId: createWeeklyHoursBlock
      summary: Add a weekly-hours block
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. 409 when it overlaps another block of the same day while both are in effect; 422 for a disabled veterinarian.'
      parameters:
