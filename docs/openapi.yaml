      - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Attachments]
      operationId: uploadPatientAttachment
      summary: Upload a file for a patient
      description: >
        Requires `clinical.write`. Any patient status. multipart/form-data with exactly one `file` part (JPEG, PNG, WebP or PDF,
        recognised by its content; at most 20 MB) and an optional `description` (max 500). Order of checks: owner
        (404/409, before the body is read); request (415 not multipart, 413 body over the limit, 400 malformed);
        form fields (422); type (415); size (413). The stored fileName gets the detected type's extension.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AttachmentUpload' }
      responses:
        '201':
          description: Stored.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/attachments/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/ValidationError' }
