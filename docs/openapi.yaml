  /api/appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List appointments
      description: Requires `appointments.read`. By startAt, then id. All statuses unless `status` is given.
      parameters:
        - { name: from, in: query, description: 'Instant with offset (encode + as %2B); appointments ending after it.', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 'Instant with offset; appointments starting before it. Must be after from.', schema: { type: string, format: date-time } }
        - { name: veterinarianId, in: query, schema: { type: string, format: uuid } }
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AppointmentStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of appointments.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book an appointment
      description: |
        Requires `appointments.manage`. The client is the patient's current owner (not sent). Patient and
        veterinarian must be active and of the clinic (422 otherwise). Times: explicit offset, 5-minute grid,
        5 minutes to 12 hours, not before the start of today in the clinic's time zone.
        Conflicts (409, every conflict listed; detail field startAt = OutsideWorkingHours, veterinarianId = VeterinarianDoubleBooked, patientId = PatientDoubleBooked; messages start with the conflict name) unless allowConflicts is true with an overrideReason, which records the accepted conflicts in `override`. Field errors (422) come first.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/appointments/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/appointments/{id}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: One appointment
      description: Requires `appointments.read`. Other clinics' appointments are 404.
      responses:
        '200':
          description: The appointment.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Appointments]
      operationId: updateAppointment
      summary: Edit or reschedule an appointment
      description: |
        Requires `appointments.manage`. Only Scheduled appointments (409 otherwise). Omitted or null fields are
        unchanged; an empty string clears reason or notes. Changing patient (the client follows), veterinarian or
        times re-applies the create rules and conflict checks; a clean placement clears an earlier override.
        Conflicts (409, every conflict listed; detail field startAt = OutsideWorkingHours, veterinarianId = VeterinarianDoubleBooked, patientId = PatientDoubleBooked; messages start with the conflict name) unless allowConflicts is true with an overrideReason, which records the accepted conflicts in `override`. Field errors (422) come first.
        Appointments are never deleted (DELETE is 405).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAppointmentRequest' }
      responses:
        '200':
          description: Updated appointment.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

