      properties:
        patientId: { type: string, format: uuid }
        veterinarianId: { type: string, format: uuid }
        appointmentId: { type: [string, 'null'], format: uuid, description: A CheckedIn appointment of the same patient. }
        subjective: { type: [string, 'null'], maxLength: 10000 }
        objective: { type: [string, 'null'], maxLength: 10000 }
        assessment: { type: [string, 'null'], maxLength: 10000 }
        plan: { type: [string, 'null'], maxLength: 10000 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: At most 3 decimals. }
        temperatureC: { type: [number, 'null'], minimum: 25, maximum: 45, description: At most 1 decimal. }
        heartRate: { type: [integer, 'null'], minimum: 1, maximum: 400 }
        respiratoryRate: { type: [integer, 'null'], minimum: 1, maximum: 200 }
        bodyConditionScore: { type: [integer, 'null'], minimum: 1, maximum: 9 }
        painScore: { type: [integer, 'null'], minimum: 0, maximum: 10 }

    UpdateConsultationRequest:
      type: object
      description: Omitted or null notes are unchanged and an empty string clears one; a vital is unchanged when omitted and cleared by an explicit null.
      properties:
        veterinarianId: { type: [string, 'null'], format: uuid }
        subjective: { type: [string, 'null'], maxLength: 10000 }
        objective: { type: [string, 'null'], maxLength: 10000 }
        assessment: { type: [string, 'null'], maxLength: 10000 }
        plan: { type: [string, 'null'], maxLength: 10000 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: At most 3 decimals. }
        temperatureC: { type: [number, 'null'], minimum: 25, maximum: 45, description: At most 1 decimal. }
        heartRate: { type: [integer, 'null'], minimum: 1, maximum: 400 }
        respiratoryRate: { type: [integer, 'null'], minimum: 1, maximum: 200 }
        bodyConditionScore: { type: [integer, 'null'], minimum: 1, maximum: 9 }
        painScore: { type: [integer, 'null'], minimum: 0, maximum: 10 }

