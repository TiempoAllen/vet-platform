        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Attachments]
      operationId: listClientAttachments
      summary: Files of a client
      description: Requires `clients.read`. Newest first; Active files unless `status=Withdrawn`. Unknown owner 404. Audited (attachment.listed).
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AttachmentStatus' } }
