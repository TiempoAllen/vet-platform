    post:
      tags: [Appointments]
      operationId: undoAppointmentCheckIn
      summary: Undo a check-in
      description: 'Requires `appointments.manage`. CheckedIn to Scheduled, only on the day of the check-in. Not allowed from the current status, or not at this time: 409.'
