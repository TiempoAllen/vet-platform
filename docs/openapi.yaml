    delete:
      tags: [Billing]
      operationId: deleteDraftInvoice
      summary: Delete a draft
      description: Requires `billing.manage`. Drafts only; an issued invoice is 409 (void it instead). Audited.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
