  /api/attachments/{id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Attachments]
      operationId: downloadAttachment
      summary: Download an attachment's content
      description: >
        Same permission as the metadata. Always a download (Content-Disposition attachment with the sanitised file
        name), with X-Content-Type-Options nosniff, Content-Security-Policy "default-src 'none'; sandbox" and
        Cache-Control "private, no-store". A withdrawn file is 409. Audited (attachment.downloaded).
      responses:
        '200':
          description: The file content.
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename=...; filename*=UTF-8''''...' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
