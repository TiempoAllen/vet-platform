      tags: [Attachments]
      operationId: listPatientAttachments
      summary: Files of a patient
      description: Requires `clinical.read`. Includes the files of the patient's consultations. Newest first; Active files unless `status=Withdrawn`. Unknown owner 404. Audited (attachment.listed).
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AttachmentStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of attachments.
          headers:
