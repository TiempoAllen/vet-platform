      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        code: { type: [string, 'null'], maxLength: 50 }
        codeSystem: { type: [string, 'null'], maxLength: 50, description: 'E.g. VeNom or SNOMED CT; not validated.' }
        status: { $ref: '#/components/schemas/DiagnosisStatus' }
        isPrimary: { type: boolean, description: At most one per consultation. }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Treatment:
