      operationId: voidInvoice
      summary: Void an issued invoice
      description: Requires `billing.manage`. Issued only (a draft or a void invoice is 409). The number stays taken. The reason is never audited.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidInvoiceRequest' }
      responses:
        '200':
          description: The whole invoice after the change.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Overall service health
      description: Checks that the database accepts connections (5-second timeout). Reports overall status only.
      security: []
      responses:
        '200':
          description: Healthy or Degraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-vet_session
      description: HttpOnly, Secure, SameSite=Strict session cookie set by POST /api/auth/login.

  headers:
    XRequestId:
      description: Correlation id; equals `requestId` in error bodies. Clients may send their own (max 64 of A-Z a-z 0-9 - _ .).
      schema: { type: string, maxLength: 64 }

  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value of the `XSRF-TOKEN` cookie. Read it just before each request; never cache it.
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VeterinarianId:
      name: veterinarianId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleExceptionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsultationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  schemas:
    Role:
      type: string
      enum: [Admin, Veterinarian, Nurse, Receptionist, Inventory]
    UserStatus:
      type: string
      enum: [Active, Disabled]
    Permission:
      type: string
      description: Stable permission name. Grants per role are listed in API.md section 4.
      enum: [users.read, users.manage, clients.read, clients.manage, patients.read, patients.manage, schedules.read, schedules.manage, schedules.manage_own, settings.manage, appointments.read, appointments.manage, clinical.read, clinical.write, consultations.complete, prescriptions.issue, vaccinations.read_due, billing.read, billing.manage]
    Species:
      type: string
      enum: [Dog, Cat, Bird, Rabbit, Rodent, Reptile, Horse, Other]
    Sex:
      type: string
      enum: [Male, Female, Unknown]
    ReproductiveStatus:
      type: string
      description: Neutered covers spayed and castrated.
      enum: [Intact, Neutered, Unknown]
    PatientStatus:
      type: string
      enum: [Active, Inactive, Deceased]
    ClientStatus:
      type: string
      enum: [Active, Inactive]
    ContactMethod:
      type: string
      enum: [Email, Phone, Sms]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword: { type: string, minLength: 12, maxLength: 1024, description: Must not equal the email address. }

    CurrentUser:
      type: object
      required: [id, name, email, clinic, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, description: 'Normalized (trimmed, lowercase).' }
        clinic:
          type: object
          required: [id, name, timeZone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            timeZone: { type: string, description: IANA time zone id. }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, status, roles, lastLoginAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [name, email, password, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        password: { type: string, minLength: 12, maxLength: 1024, description: Must not equal the email address. }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Role' }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32, description: Empty string clears the phone. }
        status:
          oneOf:
            - $ref: '#/components/schemas/UserStatus'
            - type: 'null'

    SetRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Role' }

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    UserPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Client:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, email, phone, addressLine1, addressLine2, city, region, postalCode, country, preferredContactMethod, notes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 254, description: 'Normalized (trimmed, lowercase).' }
        phone: { type: [string, 'null'], maxLength: 32 }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100, description: 'State, province or county.' }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 100 }
        preferredContactMethod:
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }
        status: { $ref: '#/components/schemas/ClientStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateClientRequest:
      type: object
      required: [firstName, lastName]
      description: Optional text fields may be omitted, null or blank; all three store null. Values are trimmed.
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100, description: 'State, province or county.' }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 100 }
        preferredContactMethod:
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }

    UpdateClientRequest:
      type: object
      description: Omitted or null text fields are unchanged; an empty string clears an optional one.
      properties:
        firstName: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        lastName: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100, description: 'State, province or county.' }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 100 }
        preferredContactMethod:
          description: Omitted leaves it unchanged; null clears it.
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }
        status:
          oneOf:
            - $ref: '#/components/schemas/ClientStatus'
            - type: 'null'

    ClientPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Patient:
      type: object
      additionalProperties: false
      required: [id, name, species, breed, sex, reproductiveStatus, dateOfBirth, dateOfBirthEstimated, markings, microchipNumber, weightKg, status, dateOfDeath, notes, client, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: [string, 'null'], maxLength: 100 }
        sex: { $ref: '#/components/schemas/Sex' }
        reproductiveStatus: { $ref: '#/components/schemas/ReproductiveStatus' }
        dateOfBirth: { type: [string, 'null'], format: date }
        dateOfBirthEstimated: { type: boolean, description: Always false when dateOfBirth is null. }
        markings: { type: [string, 'null'], maxLength: 200 }
        microchipNumber: { type: [string, 'null'], pattern: '^[A-Z0-9]{1,20}$', description: 'Normalised (no separators, upper-case).' }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: 'At most 3 decimals, no trailing zeros.' }
        status: { $ref: '#/components/schemas/PatientStatus' }
        dateOfDeath: { type: [string, 'null'], format: date, description: Only set while status is Deceased. }
        notes: { type: [string, 'null'], maxLength: 4000 }
        client:
          description: The primary owner.
          allOf:
            - $ref: '#/components/schemas/PatientClientSummary'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePatientRequest:
      type: object
      required: [clientId, name, species]
      description: Optional text fields may be omitted, null or blank; all three store null. Values are trimmed.
      properties:
        clientId: { type: string, format: uuid, description: An active client of the caller's clinic. }
        name: { type: string, minLength: 1, maxLength: 100 }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: [string, 'null'], maxLength: 100 }
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        reproductiveStatus:
          oneOf:
            - $ref: '#/components/schemas/ReproductiveStatus'
            - type: 'null'
        dateOfBirth: { type: [string, 'null'], format: date, description: Not in the future. }
        dateOfBirthEstimated: { type: [boolean, 'null'] }
        markings: { type: [string, 'null'], maxLength: 200 }
        microchipNumber: { type: [string, 'null'], maxLength: 40, description: 'Spaces, dashes and dots are ignored; the rest must be 1 to 20 letters or digits.' }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: At most 3 decimals. }
        notes: { type: [string, 'null'], maxLength: 4000 }

    UpdatePatientRequest:
      type: object
      description: Omitted or null fields are unchanged, except dateOfBirth, weightKg and dateOfDeath (explicit null clears). An empty string clears optional text.
      properties:
        clientId: { type: [string, 'null'], format: uuid, description: Transfers the patient to another active client. }
        name: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        species:
          oneOf:
            - $ref: '#/components/schemas/Species'
            - type: 'null'
        breed: { type: [string, 'null'], maxLength: 100 }
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        reproductiveStatus:
          oneOf:
            - $ref: '#/components/schemas/ReproductiveStatus'
            - type: 'null'
        dateOfBirth: { type: [string, 'null'], format: date, description: Explicit null clears it. }
        dateOfBirthEstimated: { type: [boolean, 'null'] }
        markings: { type: [string, 'null'], maxLength: 200 }
        microchipNumber: { type: [string, 'null'], maxLength: 40, description: Empty string clears it. }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: Explicit null clears it. }
        status:
          description: Leaving Deceased clears dateOfDeath.
          oneOf:
            - $ref: '#/components/schemas/PatientStatus'
            - type: 'null'
        dateOfDeath: { type: [string, 'null'], format: date, description: 'Needs status Deceased; not in the future or before dateOfBirth. Explicit null clears it.' }
        notes: { type: [string, 'null'], maxLength: 4000 }

    PatientPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Patient' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    PatientHistoryEntry:
      type: object
      required: [id, type, occurredAt, actor, details]
      description: |
        Use `type` + `id` as the key. Ignore entries with an unknown `type`. Deliberately no `discriminator`: generated
        clients must accept unknown types as this base schema and narrow on `type` themselves. Known types and their
        schemas (also in `x-known-types`): PatientRegistered → PatientRegisteredEntry; AppointmentCompleted and
        AppointmentNoShow → PatientAppointmentEntry; AppointmentCancelled → PatientAppointmentCancelledEntry;
        ConsultationCompleted → PatientConsultationEntry; VaccinationGiven → PatientVaccinationEntry; ClinicalNoteAdded →
        PatientClinicalNoteEntry; AttachmentAdded → PatientAttachmentEntry (all four only for callers with clinical.read); InvoiceIssued → PatientInvoiceEntry (only for
        callers with billing.read).
      properties:
        id: { type: string, format: uuid, description: Id of the source record; unique per type. }
        type:
          type: string
          description: 'Known so far: PatientRegistered, AppointmentCompleted, AppointmentCancelled, AppointmentNoShow, ConsultationCompleted, VaccinationGiven, ClinicalNoteAdded, AttachmentAdded, InvoiceIssued. More types are added by later milestones.'
          examples: [PatientRegistered]
        occurredAt: { type: string, format: date-time }
        actor:
          description: The staff member who caused the entry, or null.
          oneOf:
            - $ref: '#/components/schemas/PatientHistoryActor'
            - type: 'null'
        details:
          type: object
          description: Shape fixed per type; see the known entry schemas below.
      x-known-types:
        PatientRegistered: '#/components/schemas/PatientRegisteredEntry'
        AppointmentCompleted: '#/components/schemas/PatientAppointmentEntry'
        AppointmentNoShow: '#/components/schemas/PatientAppointmentEntry'
        AppointmentCancelled: '#/components/schemas/PatientAppointmentCancelledEntry'
        ConsultationCompleted: '#/components/schemas/PatientConsultationEntry'
        VaccinationGiven: '#/components/schemas/PatientVaccinationEntry'
        ClinicalNoteAdded: '#/components/schemas/PatientClinicalNoteEntry'
        AttachmentAdded: '#/components/schemas/PatientAttachmentEntry'
        InvoiceIssued: '#/components/schemas/PatientInvoiceEntry'

    PatientRegisteredEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          properties:
            type: { const: PatientRegistered }
            details: { $ref: '#/components/schemas/PatientRegisteredDetails' }

    PatientClientSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }

    PatientHistoryActor:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PatientHistoryAppointment:
      type: object
      additionalProperties: false
      required: [id, startAt, endAt, type, veterinarian]
      properties:
        id: { type: string, format: uuid }
        startAt: { type: string, format: date-time, description: UTC. }
        endAt: { type: string, format: date-time, description: UTC. }
        type: { $ref: '#/components/schemas/AppointmentType' }
        veterinarian: { $ref: '#/components/schemas/PersonSummary' }

    PatientAppointmentEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          properties:
            type: { enum: [AppointmentCompleted, AppointmentNoShow] }
            details:
              type: object
              additionalProperties: false
              required: [appointment]
              properties:
                appointment: { $ref: '#/components/schemas/PatientHistoryAppointment' }

    PatientAppointmentCancelledEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          properties:
            type: { const: AppointmentCancelled }
            details:
              type: object
              additionalProperties: false
              required: [appointment, cancelledBy]
              properties:
                appointment: { $ref: '#/components/schemas/PatientHistoryAppointment' }
                cancelledBy: { $ref: '#/components/schemas/AppointmentCancelledBy' }

    PatientConsultationEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          properties:
            type: { const: ConsultationCompleted }
            details:
              type: object
              additionalProperties: false
              required: [consultation]
              properties:
                consultation:
                  type: object
                  additionalProperties: false
                  required: [id, startedAt, completedAt, appointmentId, veterinarian, assessment, diagnoses, prescriptions]
                  properties:
                    id: { type: string, format: uuid }
                    startedAt: { type: string, format: date-time, description: UTC. }
                    completedAt: { type: string, format: date-time, description: UTC. }
                    appointmentId: { type: [string, 'null'], format: uuid }
                    veterinarian: { $ref: '#/components/schemas/PersonSummary' }
                    assessment: { type: [string, 'null'] }
                    diagnoses:
                      type: array
                      description: Primary first; status as it is now.
                      items:
                        type: object
                        additionalProperties: false
                        required: [id, name, status, isPrimary]
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          status: { $ref: '#/components/schemas/DiagnosisStatus' }
                          isPrimary: { type: boolean }
                    prescriptions:
                      type: array
                      description: In the order recorded; status as it is now.
                      items:
                        type: object
                        additionalProperties: false
                        required: [id, medicationName, status]
                        properties:
                          id: { type: string, format: uuid }
                          medicationName: { type: string }
                          status: { $ref: '#/components/schemas/PrescriptionStatus' }

    PatientVaccinationEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          description: occurredAt is the start of administeredOn in the clinic's time zone when the dose was recorded (as UTC; a later time-zone change does not move it); actor is who recorded it.
          properties:
            type: { const: VaccinationGiven }
            details:
              type: object
              additionalProperties: false
              required: [vaccination]
              properties:
                vaccination:
                  type: object
                  additionalProperties: false
                  required: [id, vaccineName, administeredOn, nextDueOn, administeredElsewhere, veterinarian, status]
                  properties:
                    id: { type: string, format: uuid }
                    vaccineName: { type: string }
                    administeredOn: { type: string, format: date }
                    nextDueOn: { type: [string, 'null'], format: date }
                    administeredElsewhere: { type: [string, 'null'] }
                    veterinarian:
                      oneOf:
                        - $ref: '#/components/schemas/PersonSummary'
                        - type: 'null'
                    status: { $ref: '#/components/schemas/VaccinationStatus', description: As it is now. }

    PatientClinicalNoteEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          description: occurredAt is when the note was added; actor is its author.
          properties:
            type: { const: ClinicalNoteAdded }
            details:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note:
                  type: object
                  additionalProperties: false
                  required: [id, text, consultationId]
                  properties:
                    id: { type: string, format: uuid }
                    text: { type: string }
                    consultationId: { type: [string, 'null'], format: uuid }

    PatientAttachmentEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          description: A patient or consultation file that is not withdrawn; occurredAt is the upload time, actor the uploader.
          properties:
            type: { const: AttachmentAdded }
            details:
              type: object
              additionalProperties: false
              required: [attachment]
              properties:
                attachment:
                  type: object
                  additionalProperties: false
                  required: [id, fileName, contentType, sizeBytes, description, consultationId]
                  properties:
                    id: { type: string, format: uuid }
                    fileName: { type: string }
                    contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                    sizeBytes: { type: integer, format: int64 }
                    description: { type: [string, 'null'] }
                    consultationId: { type: [string, 'null'], format: uuid }

    PatientInvoiceEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          description: An issued invoice for the patient (voided ones stay, with their status); occurredAt is the issue time, actor the issuer.
          properties:
            type: { const: InvoiceIssued }
            details:
              type: object
              additionalProperties: false
              required: [invoice]
              properties:
                invoice:
                  type: object
                  additionalProperties: false
                  required: [id, number, total, currency, status]
                  properties:
                    id: { type: string, format: uuid }
                    number: { type: integer }
                    total: { type: number }
                    currency: { type: string, pattern: '^[A-Z]{3}$' }
                    status: { type: string, enum: [Issued, Void], description: As it is now. }

    PatientRegisteredDetails:
      type: object
      additionalProperties: false
      required: [client]
      properties:
        client:
          description: The owner at registration with the client's current name; null if it can no longer be shown.
          oneOf:
            - $ref: '#/components/schemas/PatientClientSummary'
            - type: 'null'

    PatientHistoryPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PatientHistoryEntry' }
