      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        type:
          oneOf:
            - $ref: '#/components/schemas/TreatmentType'
            - type: 'null'
        diagnosisId: { type: [string, 'null'], format: uuid }
        dose: { type: [string, 'null'], maxLength: 100 }
        route: { type: [string, 'null'], maxLength: 100 }
        frequency: { type: [string, 'null'], maxLength: 100 }
        duration: { type: [string, 'null'], maxLength: 100 }
        notes: { type: [string, 'null'], maxLength: 2000 }

