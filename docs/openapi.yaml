        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScheduleExceptionPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ScheduleException' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    CreateScheduleExceptionRequest:
      type: object
      required: [type, startsAt, endsAt]
      description: veterinarianId is null exactly for type Closure. Instants need an explicit offset and the 5-minute grid.
      properties:
        veterinarianId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/ScheduleExceptionType' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }

    UpdateScheduleExceptionRequest:
      type: object
      description: Omitted or null fields are unchanged; an empty reason clears it.
      properties:
        type:
          oneOf:
            - $ref: '#/components/schemas/ScheduleExceptionType'
            - type: 'null'
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }

    WorkingHours:
      type: object
      additionalProperties: false
      required: [veterinarianId, timeZone, from, to, intervals]
      properties:
        veterinarianId: { type: string, format: uuid }
        timeZone: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        intervals:
          type: array
          description: Sorted, half-open, merged where they touch.
          items:
            type: object
            additionalProperties: false
            required: [startAt, endAt]
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }

    AppointmentType:
      type: string
      enum: [Consultation, Vaccination, FollowUp, Surgery, Dental, Grooming, Emergency, Other]

    AppointmentStatus:
      type: string
      description: Changed only through the lifecycle actions (POST /api/appointments/{id}/check-in etc.).
      enum: [Scheduled, CheckedIn, Completed, Cancelled, NoShow]

    AppointmentCancelledBy:
      type: string
      enum: [Client, Clinic]

    CancelAppointmentRequest:
      type: object
      required: [cancelledBy]
      properties:
        cancelledBy: { $ref: '#/components/schemas/AppointmentCancelledBy' }
        reason: { type: [string, 'null'], maxLength: 500 }

    AppointmentConflict:
      type: string
      enum: [OutsideWorkingHours, VeterinarianDoubleBooked, PatientDoubleBooked]

    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Appointment:
      type: object
      additionalProperties: false
      required: [id, patient, client, veterinarian, startAt, endAt, type, reason, notes, status, checkedInAt, completedAt, noShowAt, cancellation, override, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        patient:
          type: object
          additionalProperties: false
          required: [id, name, species]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            species: { $ref: '#/components/schemas/Species' }
        client:
          description: The patient's owner when the appointment was booked.
          allOf:
            - $ref: '#/components/schemas/PatientClientSummary'
        veterinarian: { $ref: '#/components/schemas/PersonSummary' }
        startAt: { type: string, format: date-time, description: With the clinic's local offset. }
        endAt: { type: string, format: date-time, description: With the clinic's local offset. }
        type: { $ref: '#/components/schemas/AppointmentType' }
        reason: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        checkedInAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset; kept after completion or a later cancellation. }
        completedAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        noShowAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        cancellation:
          description: Present exactly when status is Cancelled.
          oneOf:
            - type: object
              additionalProperties: false
              required: [at, by, reason]
              properties:
                at: { type: string, format: date-time, description: With the clinic's local offset. }
                by: { $ref: '#/components/schemas/AppointmentCancelledBy' }
                reason: { type: [string, 'null'], maxLength: 500 }
            - type: 'null'
        override:
          description: Present when the appointment was placed despite conflicts.
          oneOf:
            - type: object
              additionalProperties: false
              required: [reason, conflicts]
              properties:
                reason: { type: string, maxLength: 500 }
                conflicts:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/AppointmentConflict' }
            - type: 'null'
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AppointmentPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    CreateAppointmentRequest:
      type: object
      required: [patientId, veterinarianId, startAt, endAt, type]
      properties:
        patientId: { type: string, format: uuid }
        veterinarianId: { type: string, format: uuid }
        startAt: { type: string, format: date-time, description: Explicit offset; 5-minute grid; not before today. }
        endAt: { type: string, format: date-time, description: 5 minutes to 12 hours after startAt. }
        type: { $ref: '#/components/schemas/AppointmentType' }
        reason: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        allowConflicts: { type: [boolean, 'null'] }
        overrideReason: { type: [string, 'null'], maxLength: 500, description: Required with allowConflicts true; refused without it. }

    UpdateAppointmentRequest:
      type: object
      description: Omitted or null fields are unchanged; an empty string clears reason or notes.
      properties:
        patientId: { type: [string, 'null'], format: uuid }
        veterinarianId: { type: [string, 'null'], format: uuid }
        startAt: { type: [string, 'null'], format: date-time }
        endAt: { type: [string, 'null'], format: date-time }
        type:
          oneOf:
            - $ref: '#/components/schemas/AppointmentType'
            - type: 'null'
        reason: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        allowConflicts: { type: [boolean, 'null'] }
        overrideReason: { type: [string, 'null'], maxLength: 500 }

    ConsultationStatus:
      type: string
      enum: [InProgress, Completed, Discarded]

    Consultation:
      type: object
      additionalProperties: false
      required: [id, patient, appointmentId, veterinarian, status, startedAt, completedAt, completedBy, discardedAt, discardReason, subjective, objective, assessment, plan, vitals, diagnoses, treatments, prescriptions, addenda, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        patient:
          type: object
          additionalProperties: false
          required: [id, name, species]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            species: { $ref: '#/components/schemas/Species' }
        appointmentId: { type: [string, 'null'], format: uuid }
        veterinarian: { $ref: '#/components/schemas/PersonSummary' }
        status: { $ref: '#/components/schemas/ConsultationStatus' }
        startedAt: { type: string, format: date-time, description: With the clinic's local offset. }
        completedAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        completedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        discardedAt: { type: [string, 'null'], format: date-time, description: With the clinic's local offset. }
        discardReason: { type: [string, 'null'], maxLength: 500 }
        subjective: { type: [string, 'null'], maxLength: 10000 }
        objective: { type: [string, 'null'], maxLength: 10000 }
        assessment: { type: [string, 'null'], maxLength: 10000 }
        plan: { type: [string, 'null'], maxLength: 10000 }
        vitals:
          type: object
          additionalProperties: false
          required: [weightKg, temperatureC, heartRate, respiratoryRate, bodyConditionScore, painScore]
          properties:
            weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: At most 3 decimals. }
            temperatureC: { type: [number, 'null'], minimum: 25, maximum: 45, description: At most 1 decimal. }
            heartRate: { type: [integer, 'null'], minimum: 1, maximum: 400 }
            respiratoryRate: { type: [integer, 'null'], minimum: 1, maximum: 200 }
            bodyConditionScore: { type: [integer, 'null'], minimum: 1, maximum: 9 }
            painScore: { type: [integer, 'null'], minimum: 0, maximum: 10 }
        diagnoses:
          type: array
          description: Primary first, then in the order recorded.
          items: { $ref: '#/components/schemas/Diagnosis' }
        treatments:
          type: array
          description: In the order recorded.
          items: { $ref: '#/components/schemas/Treatment' }
        prescriptions:
          type: array
          description: In the order recorded.
          items: { $ref: '#/components/schemas/Prescription' }
        addenda:
          type: array
          description: Oldest first. Append-only.
          items:
            type: object
            additionalProperties: false
            required: [id, text, author, createdAt]
            properties:
              id: { type: string, format: uuid }
              text: { type: string, maxLength: 4000 }
              author:
                oneOf:
                  - $ref: '#/components/schemas/PersonSummary'
                  - type: 'null'
              createdAt: { type: string, format: date-time, description: With the clinic's local offset. }
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
