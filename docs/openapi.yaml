    post:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: Cancel an appointment
      description: 'Requires `appointments.manage`. Scheduled or CheckedIn to Cancelled (final). cancelledBy is required; the reason never reaches the audit log or the history. Not allowed from the current status: 409.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelAppointmentRequest' }
      responses:
        '200':
