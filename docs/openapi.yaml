        startTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][05]$' }
        endTime: { type: [string, 'null'], pattern: '^(([01][0-9]|2[0-3]):[0-5][05]|24:00)$' }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    ScheduleExceptionType:
