openapi: 3.1.0
info:
  title: Veterinary Management Platform API
  version: 0.9.0
  summary: Implemented endpoints as of milestone B-09.
  description: |
    Machine-readable specification of the endpoints that exist today. `docs/API.md` is the narrative contract and
    wins if the two disagree; update both in the same change. Planned endpoints (appointment status changes,
    clinical, billing, inventory, reports) are listed in `API.md` sections 7-12 and are added here when implemented.

    Conventions (API.md sections 2, 3 and 13):
    - Same-site only, HTTPS, no CORS. Authentication is the HttpOnly `__Host-vet_session` cookie.
    - Every unsafe request (POST, PUT, PATCH, DELETE), including login and logout, needs the `X-XSRF-TOKEN` header
      equal to the `XSRF-TOKEN` cookie, obtained from `GET /api/auth/csrf`.
    - Every endpoint requires a signed-in user unless it declares `security: []`.
    - Error precedence: 429, 401, 403 FORBIDDEN, 403 CSRF_TOKEN_INVALID, 400/422, then the endpoint's own result
      (scheduling: a schedules.manage_own caller acting on another veterinarian's schedule gets its 403 after 400/422).
    - A concurrent change or delete of the same record, a deadlock or a serialization failure is 409 CONFLICT
      (retry).
    - Every response carries `X-Request-Id`.
    - Enum values are accepted only as exact names (`Admin`, `Active`).
    - Instants must carry an explicit offset (`Z` or `+01:00`); dates are `YYYY-MM-DD`.
servers:
  - url: https://localhost:7096
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Clients
  - name: Patients
  - name: Clinic
  - name: Scheduling
  - name: Appointments
  - name: Operations
security:
  - sessionCookie: []

paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Issue the CSRF cookie
      description: Sets the readable `XSRF-TOKEN` cookie bound to the current session (or to "signed out"). Call before the first unsafe request, after any 401, and when a request fails with CSRF_TOKEN_INVALID.
      security: []
      responses:
        '204':
          description: Cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`XSRF-TOKEN=...; Secure; SameSite=Strict; Path=/`'
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Rate limited to 10 attempts per minute per client address (IPv6 grouped by /64). Every credential failure
        (unknown email, wrong password, locked account, disabled user, suspended clinic) returns the same 401 with the
        message `Email or password is incorrect.` Five consecutive wrong passwords lock the account for 15 minutes.
        Signing in again from the same browser replaces the previous session.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Sets the session cookie and a new `XSRF-TOKEN` cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Revokes the session server-side and clears the cookie. Succeeds even when not signed in; a valid CSRF token is still required.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Signed out. Sets a new signed-out `XSRF-TOKEN` cookie.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user, clinic, roles and permissions
      description: Roles and permissions reflect the current state on every call. Use `permissions` to decide what to show; the API enforces them regardless.
      responses:
        '200':
          description: The signed-in user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password
      description: |
        Rate limited like login. On success every other session of the user is signed out; this one stays.
        Wrong current passwords count towards the account lockout; the attempt that locks the account returns 401
        and signs out every session, this one included.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '422':
          description: '`currentPassword` is incorrect, or `newPassword` fails the policy (12-1024 characters, not the email).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List the clinic's users
      description: 'Requires `users.read`. Users who never signed in sort last ascending and first descending; ties are broken by id.'
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of name or email. `%` and `_` match literally.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, email, -email, createdAt, -createdAt, lastLoginAt, -lastLoginAt]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user in the caller's clinic
      description: Requires `users.manage`. Emails are unique across the whole platform.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/users/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one user
      description: Requires `users.read`. Users of other clinics are 404.
      responses:
        '200':
          description: The user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Partially update a user
      description: |
        Requires `users.manage`. Omitted or null fields are unchanged; `"phone": ""` clears the phone.
        Disabling a user ends all their sessions immediately; re-enabling does not restore them.
        409 when the email is taken (detail field `email`), when disabling yourself, or when disabling the clinic's
        last active administrator.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace a user's roles
      description: Requires `users.manage`. Duplicates are ignored. 409 when it would remove Admin from the clinic's last active administrator. Takes effect on the user's next request.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolesRequest' }
      responses:
        '200':
          description: Updated user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List the clinic's clients
      description: Requires `clients.read`. Lists active and inactive clients unless `status` is given; ties are broken by id.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of first name, last name, "first last", email or phone. `%` and `_` match literally.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClientStatus' }
        - name: sort
          in: query
          description: '`name` sorts by last name, then first name. Ties are broken by id in the same direction.'
          schema:
            type: string
            enum: [name, -name, createdAt, -createdAt, updatedAt, -updatedAt]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of clients.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Clients]
      operationId: createClient
      summary: Create a client in the caller's clinic
      description: Requires `clients.manage`. New clients are `Active`. Emails need not be unique.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClientRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/clients/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      operationId: getClient
      summary: Get one client
      description: Requires `clients.read`. Clients of other clinics are 404.
      responses:
        '200':
          description: The client.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clients]
      operationId: updateClient
      summary: Partially update a client
      description: |
        Requires `clients.manage`. Omitted or null text fields are unchanged; `""` clears an optional text field.
        `preferredContactMethod` is unchanged when omitted and cleared by an explicit `null`. Deactivate with
        `"status": "Inactive"`; clients are never deleted (DELETE is 405 METHOD_NOT_ALLOWED).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClientRequest' }
      responses:
        '200':
          description: Updated client.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List the clinic's patients
      description: Requires `patients.read`. Lists all statuses unless `status` is given; ties are broken by id in the sort direction.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the patient's name or the owner's first, last or full name, or a substring of the microchip number ignoring spaces, dashes and dots. `%` and `_` match literally.
          schema: { type: string, maxLength: 100 }
        - name: clientId
          in: query
          description: Only this owner's patients. An unknown id returns an empty page.
          schema: { type: string, format: uuid }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PatientStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, createdAt, -createdAt, updatedAt, -updatedAt]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of patients.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Create a patient in the caller's clinic
      description: |
        Requires `patients.manage`. New patients are `Active`. `clientId` must be an active client of the clinic
        (otherwise 422 on `clientId`, same message for unknown, inactive and other clinics' clients). Microchip numbers
        are normalised and unique within the clinic (409). Server-side problems are reported together in one 422.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePatientRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/patients/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/patients/{id}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Get one patient
      description: Requires `patients.read`. Patients of other clinics are 404.
      responses:
        '200':
          description: The patient.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Partially update or transfer a patient
      description: |
        Requires `patients.manage`. Omitted or null fields are unchanged, except `dateOfBirth`, `weightKg` and
        `dateOfDeath`, which an explicit null clears; `""` clears optional text. `clientId` transfers to another
        active client of the clinic. `dateOfDeath` needs status `Deceased`; leaving `Deceased` clears it. Patients
        are never deleted (DELETE is 405 METHOD_NOT_ALLOWED).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePatientRequest' }
      responses:
        '200':
          description: Updated patient.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/patients/{id}/history:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      operationId: getPatientHistory
      summary: The patient's timeline, newest first
      description: |
        Requires `patients.read`. Unknown or other clinics' patients are 404. Entries have a fixed `details` shape per
        `type`; clients must ignore types they do not know, because later milestones add types without a version
        change. Ties on `occurredAt` are broken by `id`, then `type`, descending (uuids compare as lowercase hex
        strings).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of history entries.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/clinic:
    get:
      tags: [Clinic]
      operationId: getClinic
      summary: The caller's clinic
      description: Any signed-in user.
      responses:
        '200':
          description: The clinic.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Clinic]
      operationId: updateClinic
      summary: Change the clinic's time zone
      description: Requires `settings.manage`. `timeZone` must be an IANA id (Windows ids are 422). Audited.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClinicRequest' }
      responses:
        '200':
          description: Updated clinic.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/veterinarians:
    get:
      tags: [Scheduling]
      operationId: listVeterinarians
      summary: Active veterinarians, by name
      description: Requires `schedules.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of veterinarians.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VeterinarianPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/veterinarians/{veterinarianId}/weekly-hours:
    parameters:
      - $ref: '#/components/parameters/VeterinarianId'
    get:
      tags: [Scheduling]
      operationId: listWeeklyHours
      summary: All weekly-hours blocks of a veterinarian
      description: Requires `schedules.read`. Not paginated; Monday first, then by start time.
      responses:
        '200':
          description: The blocks.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingHoursBlockList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Scheduling]
      operationId: createWeeklyHoursBlock
      summary: Add a weekly-hours block
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. 409 when it overlaps another block of the same day while both are in effect; 422 for a disabled veterinarian.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkingHoursBlockRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/veterinarians/{veterinarianId}/weekly-hours/{blockId}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingHoursBlock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/veterinarians/{veterinarianId}/weekly-hours/{blockId}:
    parameters:
      - $ref: '#/components/parameters/VeterinarianId'
      - $ref: '#/components/parameters/BlockId'
    patch:
      tags: [Scheduling]
      operationId: updateWeeklyHoursBlock
      summary: Change a weekly-hours block
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. Omitted or null fields are unchanged; an explicit null effectiveTo clears it.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkingHoursBlockRequest' }
      responses:
        '200':
          description: Updated block.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingHoursBlock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Scheduling]
      operationId: deleteWeeklyHoursBlock
      summary: Remove a weekly-hours block
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. Audited.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/veterinarians/{veterinarianId}/working-hours:
    parameters:
      - $ref: '#/components/parameters/VeterinarianId'
    get:
      tags: [Scheduling]
      operationId: getWorkingHours
      summary: Actual working periods for a date range
      description: |
        Requires `schedules.read`. Weekly hours for the local days `from`..`to` (inclusive, at most 62 days), minus
        the veterinarian's exceptions and all clinic closures, as half-open intervals with the clinic's local offset.
        Appointments are not subtracted (B-09).
      parameters:
        - { name: from, in: query, required: true, description: 'YYYY-MM-DD, 2000-01-01..2100-12-31.', schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'YYYY-MM-DD, at most 62 days after from.', schema: { type: string, format: date } }
      responses:
        '200':
          description: Working periods.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingHours' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/schedule-exceptions:
    get:
      tags: [Scheduling]
      operationId: listScheduleExceptions
      summary: Exceptions and closures
      description: Requires `schedules.read`. By startsAt, then id. Details are masked as `Unavailable` for callers who are neither schedule managers nor the veterinarian concerned.
      parameters:
        - { name: veterinarianId, in: query, description: "That veterinarian's exceptions and all closures.", schema: { type: string, format: uuid } }
        - { name: from, in: query, description: 'Instant with offset (encode + as %2B); exceptions ending after it.', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Instant with offset; exceptions starting before it. Must be after from., schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of exceptions.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleExceptionPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Scheduling]
      operationId: createScheduleException
      summary: Record an exception or a clinic closure
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. Closures (no veterinarianId, type Closure) need `schedules.manage`.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleExceptionRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/schedule-exceptions/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleException' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/schedule-exceptions/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleExceptionId'
    get:
      tags: [Scheduling]
      operationId: getScheduleException
      summary: One exception
      description: Requires `schedules.read`. Other clinics' exceptions are 404.
      responses:
        '200':
          description: The exception.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleException' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Scheduling]
      operationId: updateScheduleException
      summary: Change an exception
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. The veterinarian cannot change; a closure cannot become a personal exception or the reverse.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateScheduleExceptionRequest' }
      responses:
        '200':
          description: Updated exception.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleException' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Scheduling]
      operationId: deleteScheduleException
      summary: Cancel an exception
      description: 'Requires `schedules.manage`, or `schedules.manage_own` for the caller''s own schedule. 403 comes before body validation only when the caller has neither manage permission; the not-your-own-schedule 403 comes after 400/422 body checks. Audited.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List appointments
      description: Requires `appointments.read`. By startAt, then id. All statuses unless `status` is given.
      parameters:
        - { name: from, in: query, description: 'Instant with offset (encode + as %2B); appointments ending after it.', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 'Instant with offset; appointments starting before it. Must be after from.', schema: { type: string, format: date-time } }
        - { name: veterinarianId, in: query, schema: { type: string, format: uuid } }
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AppointmentStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of appointments.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book an appointment
      description: |
        Requires `appointments.manage`. The client is the patient's current owner (not sent). Patient and
        veterinarian must be active and of the clinic (422 otherwise). Times: explicit offset, 5-minute grid,
        5 minutes to 12 hours, not before the start of today in the clinic's time zone.
        Conflicts (409, every conflict listed; detail field startAt = OutsideWorkingHours, veterinarianId = VeterinarianDoubleBooked, patientId = PatientDoubleBooked; messages start with the conflict name) unless allowConflicts is true with an overrideReason, which records the accepted conflicts in `override`. Field errors (422) come first.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: /api/appointments/{id}
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/appointments/{id}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: One appointment
      description: Requires `appointments.read`. Other clinics' appointments are 404.
      responses:
        '200':
          description: The appointment.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Appointments]
      operationId: updateAppointment
      summary: Edit or reschedule an appointment
      description: |
        Requires `appointments.manage`. Only Scheduled appointments (409 otherwise). Omitted or null fields are
        unchanged; an empty string clears reason or notes. Changing patient (the client follows), veterinarian or
        times re-applies the create rules and conflict checks; a clean placement clears an earlier override.
        Conflicts (409, every conflict listed; detail field startAt = OutsideWorkingHours, veterinarianId = VeterinarianDoubleBooked, patientId = PatientDoubleBooked; messages start with the conflict name) unless allowConflicts is true with an overrideReason, which records the accepted conflicts in `override`. Field errors (422) come first.
        Appointments are never deleted (DELETE is 405).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAppointmentRequest' }
      responses:
        '200':
          description: Updated appointment.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenOrCsrf' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Overall service health
      description: Checks that the database accepts connections (5-second timeout). Reports overall status only.
      security: []
      responses:
        '200':
          description: Healthy or Degraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-vet_session
      description: HttpOnly, Secure, SameSite=Strict session cookie set by POST /api/auth/login.

  headers:
    XRequestId:
      description: Correlation id; equals `requestId` in error bodies. Clients may send their own (max 64 of A-Z a-z 0-9 - _ .).
      schema: { type: string, maxLength: 64 }

  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value of the `XSRF-TOKEN` cookie. Read it just before each request; never cache it.
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VeterinarianId:
      name: veterinarianId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleExceptionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  schemas:
    Role:
      type: string
      enum: [Admin, Veterinarian, Nurse, Receptionist, Inventory]
    UserStatus:
      type: string
      enum: [Active, Disabled]
    Permission:
      type: string
      description: Stable permission name. Grants per role are listed in API.md section 4.
      enum: [users.read, users.manage, clients.read, clients.manage, patients.read, patients.manage, schedules.read, schedules.manage, schedules.manage_own, settings.manage, appointments.read, appointments.manage]
    Species:
      type: string
      enum: [Dog, Cat, Bird, Rabbit, Rodent, Reptile, Horse, Other]
    Sex:
      type: string
      enum: [Male, Female, Unknown]
    ReproductiveStatus:
      type: string
      description: Neutered covers spayed and castrated.
      enum: [Intact, Neutered, Unknown]
    PatientStatus:
      type: string
      enum: [Active, Inactive, Deceased]
    ClientStatus:
      type: string
      enum: [Active, Inactive]
    ContactMethod:
      type: string
      enum: [Email, Phone, Sms]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword: { type: string, minLength: 12, maxLength: 1024, description: Must not equal the email address. }

    CurrentUser:
      type: object
      required: [id, name, email, clinic, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, description: 'Normalized (trimmed, lowercase).' }
        clinic:
          type: object
          required: [id, name, timeZone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            timeZone: { type: string, description: IANA time zone id. }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, status, roles, lastLoginAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [name, email, password, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        password: { type: string, minLength: 12, maxLength: 1024, description: Must not equal the email address. }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Role' }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32, description: Empty string clears the phone. }
        status:
          oneOf:
            - $ref: '#/components/schemas/UserStatus'
            - type: 'null'

    SetRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Role' }

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    UserPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Client:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName, email, phone, addressLine1, addressLine2, city, region, postalCode, country, preferredContactMethod, notes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 254, description: 'Normalized (trimmed, lowercase).' }
        phone: { type: [string, 'null'], maxLength: 32 }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100, description: 'State, province or county.' }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 100 }
        preferredContactMethod:
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }
        status: { $ref: '#/components/schemas/ClientStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateClientRequest:
      type: object
      required: [firstName, lastName]
      description: Optional text fields may be omitted, null or blank; all three store null. Values are trimmed.
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100, description: 'State, province or county.' }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 100 }
        preferredContactMethod:
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }

    UpdateClientRequest:
      type: object
      description: Omitted or null text fields are unchanged; an empty string clears an optional one.
      properties:
        firstName: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        lastName: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        addressLine1: { type: [string, 'null'], maxLength: 200 }
        addressLine2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100, description: 'State, province or county.' }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 100 }
        preferredContactMethod:
          description: Omitted leaves it unchanged; null clears it.
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }
        status:
          oneOf:
            - $ref: '#/components/schemas/ClientStatus'
            - type: 'null'

    ClientPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Patient:
      type: object
      additionalProperties: false
      required: [id, name, species, breed, sex, reproductiveStatus, dateOfBirth, dateOfBirthEstimated, markings, microchipNumber, weightKg, status, dateOfDeath, notes, client, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: [string, 'null'], maxLength: 100 }
        sex: { $ref: '#/components/schemas/Sex' }
        reproductiveStatus: { $ref: '#/components/schemas/ReproductiveStatus' }
        dateOfBirth: { type: [string, 'null'], format: date }
        dateOfBirthEstimated: { type: boolean, description: Always false when dateOfBirth is null. }
        markings: { type: [string, 'null'], maxLength: 200 }
        microchipNumber: { type: [string, 'null'], pattern: '^[A-Z0-9]{1,20}$', description: 'Normalised (no separators, upper-case).' }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: 'At most 3 decimals, no trailing zeros.' }
        status: { $ref: '#/components/schemas/PatientStatus' }
        dateOfDeath: { type: [string, 'null'], format: date, description: Only set while status is Deceased. }
        notes: { type: [string, 'null'], maxLength: 4000 }
        client:
          description: The primary owner.
          allOf:
            - $ref: '#/components/schemas/PatientClientSummary'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePatientRequest:
      type: object
      required: [clientId, name, species]
      description: Optional text fields may be omitted, null or blank; all three store null. Values are trimmed.
      properties:
        clientId: { type: string, format: uuid, description: An active client of the caller's clinic. }
        name: { type: string, minLength: 1, maxLength: 100 }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: [string, 'null'], maxLength: 100 }
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        reproductiveStatus:
          oneOf:
            - $ref: '#/components/schemas/ReproductiveStatus'
            - type: 'null'
        dateOfBirth: { type: [string, 'null'], format: date, description: Not in the future. }
        dateOfBirthEstimated: { type: [boolean, 'null'] }
        markings: { type: [string, 'null'], maxLength: 200 }
        microchipNumber: { type: [string, 'null'], maxLength: 40, description: 'Spaces, dashes and dots are ignored; the rest must be 1 to 20 letters or digits.' }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: At most 3 decimals. }
        notes: { type: [string, 'null'], maxLength: 4000 }

    UpdatePatientRequest:
      type: object
      description: Omitted or null fields are unchanged, except dateOfBirth, weightKg and dateOfDeath (explicit null clears). An empty string clears optional text.
      properties:
        clientId: { type: [string, 'null'], format: uuid, description: Transfers the patient to another active client. }
        name: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        species:
          oneOf:
            - $ref: '#/components/schemas/Species'
            - type: 'null'
        breed: { type: [string, 'null'], maxLength: 100 }
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        reproductiveStatus:
          oneOf:
            - $ref: '#/components/schemas/ReproductiveStatus'
            - type: 'null'
        dateOfBirth: { type: [string, 'null'], format: date, description: Explicit null clears it. }
        dateOfBirthEstimated: { type: [boolean, 'null'] }
        markings: { type: [string, 'null'], maxLength: 200 }
        microchipNumber: { type: [string, 'null'], maxLength: 40, description: Empty string clears it. }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2000, description: Explicit null clears it. }
        status:
          description: Leaving Deceased clears dateOfDeath.
          oneOf:
            - $ref: '#/components/schemas/PatientStatus'
            - type: 'null'
        dateOfDeath: { type: [string, 'null'], format: date, description: 'Needs status Deceased; not in the future or before dateOfBirth. Explicit null clears it.' }
        notes: { type: [string, 'null'], maxLength: 4000 }

    PatientPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Patient' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    PatientHistoryEntry:
      type: object
      required: [id, type, occurredAt, actor, details]
      description: |
        Use `type` + `id` as the key. Ignore entries with an unknown `type`. Deliberately no `discriminator`: generated
        clients must accept unknown types as this base schema and narrow on `type` themselves. Known types and their
        schemas (also in `x-known-types`): PatientRegistered → PatientRegisteredEntry.
      properties:
        id: { type: string, format: uuid, description: Id of the source record; unique per type. }
        type:
          type: string
          description: 'Known so far: PatientRegistered. More types are added by later milestones.'
          examples: [PatientRegistered]
        occurredAt: { type: string, format: date-time }
        actor:
          description: The staff member who caused the entry, or null.
          oneOf:
            - $ref: '#/components/schemas/PatientHistoryActor'
            - type: 'null'
        details:
          type: object
          description: Shape fixed per type; see the known entry schemas below.
      x-known-types:
        PatientRegistered: '#/components/schemas/PatientRegisteredEntry'

    PatientRegisteredEntry:
      allOf:
        - $ref: '#/components/schemas/PatientHistoryEntry'
        - type: object
          properties:
            type: { const: PatientRegistered }
            details: { $ref: '#/components/schemas/PatientRegisteredDetails' }

    PatientClientSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }

    PatientHistoryActor:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PatientRegisteredDetails:
      type: object
      additionalProperties: false
      required: [client]
      properties:
        client:
          description: The owner at registration with the client's current name; null if it can no longer be shown.
          oneOf:
            - $ref: '#/components/schemas/PatientClientSummary'
            - type: 'null'

    PatientHistoryPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PatientHistoryEntry' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Clinic:
      type: object
      additionalProperties: false
      required: [id, name, timeZone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timeZone: { type: string, description: IANA time zone id. }

    UpdateClinicRequest:
      type: object
      properties:
        timeZone: { type: [string, 'null'], maxLength: 64, description: 'IANA id, e.g. Europe/London.' }

    DayOfWeek:
      type: string
      enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

    Veterinarian:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }

    VeterinarianPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Veterinarian' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    WorkingHoursBlock:
      type: object
      additionalProperties: false
      required: [id, veterinarianId, dayOfWeek, startTime, endTime, effectiveFrom, effectiveTo, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        veterinarianId: { type: string, format: uuid }
        dayOfWeek: { $ref: '#/components/schemas/DayOfWeek' }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][05]$', description: Local HH:mm on the 5-minute grid. }
        endTime: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][05]|24:00)$', description: Local HH:mm on the 5-minute grid; 24:00 allowed. }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date, description: Inclusive; null is open-ended. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkingHoursBlockList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkingHoursBlock' }

    CreateWorkingHoursBlockRequest:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { $ref: '#/components/schemas/DayOfWeek' }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][05]$' }
        endTime: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][05]|24:00)$' }
        effectiveFrom: { type: [string, 'null'], format: date, description: Default today in the clinic time zone. }
        effectiveTo: { type: [string, 'null'], format: date }

    UpdateWorkingHoursBlockRequest:
      type: object
      description: Omitted or null fields are unchanged, except effectiveTo (explicit null clears it).
      properties:
        dayOfWeek:
          oneOf:
            - $ref: '#/components/schemas/DayOfWeek'
            - type: 'null'
        startTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][05]$' }
        endTime: { type: [string, 'null'], pattern: '^(([01][0-9]|2[0-3]):[0-5][05]|24:00)$' }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    ScheduleExceptionType:
      type: string
      description: Accepted in requests.
      enum: [Leave, Sickness, Training, Other, Closure]

    ScheduleException:
      type: object
      additionalProperties: false
      required: [id, veterinarianId, type, startsAt, endsAt, reason, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        veterinarianId: { type: [string, 'null'], format: uuid, description: Null for clinic closures. }
        type:
          type: string
          description: '`Unavailable` (with reason null) when the caller may not see the details; never accepted as input.'
          enum: [Leave, Sickness, Training, Other, Closure, Unavailable]
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScheduleExceptionPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ScheduleException' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    CreateScheduleExceptionRequest:
      type: object
      required: [type, startsAt, endsAt]
      description: veterinarianId is null exactly for type Closure. Instants need an explicit offset and the 5-minute grid.
      properties:
        veterinarianId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/ScheduleExceptionType' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }

    UpdateScheduleExceptionRequest:
      type: object
      description: Omitted or null fields are unchanged; an empty reason clears it.
      properties:
        type:
          oneOf:
            - $ref: '#/components/schemas/ScheduleExceptionType'
            - type: 'null'
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }

    WorkingHours:
      type: object
      additionalProperties: false
      required: [veterinarianId, timeZone, from, to, intervals]
      properties:
        veterinarianId: { type: string, format: uuid }
        timeZone: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        intervals:
          type: array
          description: Sorted, half-open, merged where they touch.
          items:
            type: object
            additionalProperties: false
            required: [startAt, endAt]
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }

    AppointmentType:
      type: string
      enum: [Consultation, Vaccination, FollowUp, Surgery, Dental, Grooming, Emergency, Other]

    AppointmentStatus:
      type: string
      description: Only Scheduled is produced in B-09; the rest appear with B-10.
      enum: [Scheduled, CheckedIn, Completed, Cancelled, NoShow]

    AppointmentConflict:
      type: string
      enum: [OutsideWorkingHours, VeterinarianDoubleBooked, PatientDoubleBooked]

    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Appointment:
      type: object
      additionalProperties: false
      required: [id, patient, client, veterinarian, startAt, endAt, type, reason, notes, status, override, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        patient:
          type: object
          additionalProperties: false
          required: [id, name, species]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            species: { $ref: '#/components/schemas/Species' }
        client:
          description: The patient's owner when the appointment was booked.
          allOf:
            - $ref: '#/components/schemas/PatientClientSummary'
        veterinarian: { $ref: '#/components/schemas/PersonSummary' }
        startAt: { type: string, format: date-time, description: With the clinic's local offset. }
        endAt: { type: string, format: date-time, description: With the clinic's local offset. }
        type: { $ref: '#/components/schemas/AppointmentType' }
        reason: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        override:
          description: Present when the appointment was placed despite conflicts.
          oneOf:
            - type: object
              additionalProperties: false
              required: [reason, conflicts]
              properties:
                reason: { type: string, maxLength: 500 }
                conflicts:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/AppointmentConflict' }
            - type: 'null'
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AppointmentPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    CreateAppointmentRequest:
      type: object
      required: [patientId, veterinarianId, startAt, endAt, type]
      properties:
        patientId: { type: string, format: uuid }
        veterinarianId: { type: string, format: uuid }
        startAt: { type: string, format: date-time, description: Explicit offset; 5-minute grid; not before today. }
        endAt: { type: string, format: date-time, description: 5 minutes to 12 hours after startAt. }
        type: { $ref: '#/components/schemas/AppointmentType' }
        reason: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        allowConflicts: { type: [boolean, 'null'] }
        overrideReason: { type: [string, 'null'], maxLength: 500, description: Required with allowConflicts true; refused without it. }

    UpdateAppointmentRequest:
      type: object
      description: Omitted or null fields are unchanged; an empty string clears reason or notes.
      properties:
        patientId: { type: [string, 'null'], format: uuid }
        veterinarianId: { type: [string, 'null'], format: uuid }
        startAt: { type: [string, 'null'], format: date-time }
        endAt: { type: [string, 'null'], format: date-time }
        type:
          oneOf:
            - $ref: '#/components/schemas/AppointmentType'
            - type: 'null'
        reason: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        allowConflicts: { type: [boolean, 'null'] }
        overrideReason: { type: [string, 'null'], maxLength: 500 }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [Healthy, Degraded, Unhealthy] }

    ErrorCode:
      type: string
      enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, CSRF_TOKEN_INVALID, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
             UNSUPPORTED_MEDIA_TYPE, VALIDATION_ERROR, RATE_LIMITED, INTERNAL_ERROR]

    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field: { type: string, description: camelCase field or query parameter name }
                  message: { type: string }
        requestId: { type: string }

  responses:
    BadRequest:
      description: Body missing or not valid JSON, or an unknown enum name in the body (BAD_REQUEST).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Not signed in or session ended (UNAUTHENTICATED). Refresh the CSRF token, then show the login screen.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Signed in but missing the required permission (FORBIDDEN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CsrfInvalid:
      description: Missing or invalid X-XSRF-TOKEN (CSRF_TOKEN_INVALID). Refresh with GET /api/auth/csrf and retry once.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ForbiddenOrCsrf:
      description: FORBIDDEN (missing permission) or CSRF_TOKEN_INVALID; check error.code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Unknown id, or a record of another clinic (NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Business rule conflict (CONFLICT); show error.message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Field or query values invalid (VALIDATION_ERROR); details name each field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many attempts (RATE_LIMITED).
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
