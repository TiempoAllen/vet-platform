        - { name: to, in: query, required: true, description: 'YYYY-MM-DD, at most 62 days after from.', schema: { type: string, format: date } }
      responses:
        '200':
          description: Working periods.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
