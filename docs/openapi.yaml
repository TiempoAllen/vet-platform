      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/TreatmentType' }
        diagnosisId: { type: [string, 'null'], format: uuid, description: A diagnosis of the same consultation. }
        dose: { type: [string, 'null'], maxLength: 100 }
        route: { type: [string, 'null'], maxLength: 100 }
        frequency: { type: [string, 'null'], maxLength: 100 }
        duration: { type: [string, 'null'], maxLength: 100 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDiagnosisRequest:
      type: object
      required: [name]
      description: Defaults to Provisional and not primary. Making it primary clears the flag on the others.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        code: { type: [string, 'null'], maxLength: 50 }
        codeSystem: { type: [string, 'null'], maxLength: 50, description: Needs a code. }
        status:
          oneOf:
            - $ref: '#/components/schemas/DiagnosisStatus'
            - type: 'null'
        isPrimary: { type: [boolean, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }

    UpdateDiagnosisRequest:
      type: object
      description: Omitted or null fields are unchanged; an empty string clears optional text. After completion only status may be sent.
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        code: { type: [string, 'null'], maxLength: 50 }
        codeSystem: { type: [string, 'null'], maxLength: 50 }
        status:
          oneOf:
            - $ref: '#/components/schemas/DiagnosisStatus'
            - type: 'null'
        isPrimary: { type: [boolean, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CreateTreatmentRequest:
      type: object
      required: [name, type]
      properties:
